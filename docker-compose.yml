services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cdms
      POSTGRES_PASSWORD: cdms
      POSTGRES_DB: cdms
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdms -d cdms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cdms:
    build: ./cdms/
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
